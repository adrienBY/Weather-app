name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the single-file web app (assembles src/, fetches + inlines the cloud, Milky Way, rain-drop and font assets)
        run: node scripts/build-web.mjs

      - name: Generate + patch the Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      # One debug key for every build so each APK installs over the previous one.
      # First run generates it and parks it on an orphan `signing` branch.
      - name: Signing key
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.android
          if git fetch --depth=1 origin signing 2>/dev/null; then
            git show FETCH_HEAD:debug.keystore.b64 | base64 -d > ~/.android/debug.keystore
            echo "Reusing the stored signing key"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
              -dname "CN=Android Debug,O=Android,C=US"
            tmp=$(mktemp -d)
            base64 ~/.android/debug.keystore > "$tmp/debug.keystore.b64"
            cd "$tmp"
            git init -q -b signing
            git add debug.keystore.b64
            git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Debug signing key (generated by CI)"
            git push -q "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" signing
            echo "Generated and stored a new signing key"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Ciel-1.0.${{ github.run_number }}.apk"
          cp www/index.html index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Ciel-1.0.${{ github.run_number }}
          path: |
            Ciel-*.apk
            index.html

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ciel 1.0.${{ github.run_number }}
          body: |
            Debug-signed APK built from ${{ github.sha }} — open it on the phone to install.
            `index.html` is the single-file PWA build of the same commit.
          files: |
            Ciel-*.apk
            index.html
          make_latest: true

  # Optional: hosts the PWA on GitHub Pages so Chrome can "Install app".
  # Skips itself until Settings → Pages → Source is set to "GitHub Actions".
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }}/pages --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off. Settings → Pages → Source: GitHub Actions to get an installable PWA URL."
          fi
      - if: steps.check.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.on == 'true'
        run: npm install --no-audit --no-fund && node scripts/build-web.mjs
      - if: steps.check.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - if: steps.check.outputs.on == 'true'
        uses: actions/deploy-pages@v4
